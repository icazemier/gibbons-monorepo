packages:
  - "packages/*"

# pnpm 11 stopped reading the "pnpm" field in package.json, so everything below
# lives here now. It is the same configuration, in the shape v11 reads.

# The structural defence against install-script supply-chain attacks: a package
# not listed here never runs its lifecycle scripts. Only four of this tree's
# dependencies ask to build at all, and they are these. v11 renamed this from
# onlyBuiltDependencies and made it a map, so a package can also be denied
# explicitly rather than merely left off.
allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  embedded-postgres: true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/linux-x64": true

# Security pins, not cruft. Every entry maps to an advisory in a transitive of
# eslint, semantic-release or typedoc — packages we cannot bump directly because
# nothing declares them. Removing one reopens its advisory.
overrides:
  minimatch: ^10.2.6
  lodash-es: ^4.18.1
  vite: ^7.3.2
  fast-uri: ^3.1.5
  follow-redirects: ^1.16.0
  postcss: ^8.5.23
  picomatch: ^4.0.5
  brace-expansion: ^5.0.9
  js-yaml: ^4.3.0
  shell-quote: ^1.10.0
  linkify-it: ^5.0.2
  esbuild: ^0.28.1
  undici@6: ^6.28.0
  undici@7: ^7.29.0

# Single source of truth for shared DEV dependency versions.
# Packages reference these via "catalog:". Bump once here.
#
# Runtime `dependencies` and `peerDependencies` of the published packages must
# NOT use "catalog:" — they carry literal ranges instead. semantic-release
# publishes with `npm publish`, and only `pnpm publish`/`pnpm pack` rewrite the
# catalog protocol, so a catalog entry ships verbatim to the registry and every
# npm/yarn/bun install of that package dies with EUNSUPPORTEDPROTOCOL. That
# shipped in 2.0.0 through 3.0.1 before anyone noticed, because a pnpm workspace
# resolves it fine locally. devDependencies are safe: consumers never resolve
# them.
catalog:
  # Shared RUNTIME versions. Packages must not reference these with "catalog:"
  # — see above. `pnpm lint` checks that each package declares the literal range
  # named here, and `pnpm lint:fix` writes it. Bump once, here.
  "@icazemier/gibbons": ^6.0.10
  cosmiconfig: ^10.0.0
  yargs: ^17.7.2
  # shared dev tooling
  # jsr is pinned exactly, not ranged: it publishes, so which build runs is not
  # something a caret should decide. Declared here rather than fetched by npx so
  # the lockfile carries its integrity hash.
  jsr: 0.14.3
  "@commitlint/cli": ^21.2.1
  "@commitlint/config-conventional": ^21.2.0
  "@eslint/js": ^10.0.0
  "@types/node": ^24.13.3
  "@types/yargs": ^17.0.33
  "@vitest/coverage-v8": ^4.1.10
  conventional-changelog-conventionalcommits: ^10.2.1
  cross-env: ^10.1.0
  dotenv: ^17.4.2
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.3
  eslint-plugin-prettier: ^5.4.0
  husky: ^9.1.7
  noop-stream: ^1.0.0
  rimraf: ^6.1.3
  semantic-release: ^25.0.9
  semantic-release-monorepo: ^8.0.2
  typedoc: ^0.28.20
  typescript: ^6.0.3
  typescript-eslint: ^8.66.0
  vitest: ^4.1.10
