packages:
  - "packages/*"

# pnpm 11 stopped reading the "pnpm" field in package.json, so everything below
# lives here now. It is the same configuration, in the shape v11 reads.

# The structural defence against install-script supply-chain attacks: a package
# not listed here never runs its lifecycle scripts. Only four of this tree's
# dependencies ask to build at all, and they are these. v11 renamed this from
# onlyBuiltDependencies and made it a map, so a package can also be denied
# explicitly rather than merely left off.
allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  embedded-postgres: true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/linux-x64": true

# Security pins, not cruft. Every entry maps to an advisory in a transitive of
# eslint or typedoc — packages we cannot bump directly because nothing declares
# them. Removing one reopens its advisory, so an override earns its place by
# still being load-bearing.
#
# Four were dropped when semantic-release left, each pinning something no
# longer in the tree: `shell-quote`, `lodash-es`, and `undici` at both 6 and 7.
# An override for an absent package is not a safety margin, it is a claim that
# stops being checked — the lockfile held no entry for any of them, only the
# override lines themselves.
#
# `vite` is doing a different job from the rest and should not be read as a CVE
# floor: vitest accepts `^6 || ^7 || ^8`, so this pin is a *ceiling* keeping the
# major at 7 rather than a floor over a vulnerable version.
#
# `js-yaml` and `read-yaml-file` are one pin, not two. changesets reaches
# js-yaml through `read-yaml-file`, whose 1.x line calls the `safeLoad` that
# js-yaml 4 removed — so the js-yaml pin alone crashes `changeset pre enter`.
# Letting that one dependent fall back to js-yaml 3 is not the way out: 3.14.1,
# which is what its `^3.6.1` resolves to, carries four open advisories
# (GHSA-5p4m-2wfm-xmqj, GHSA-52cp-r559-cp3m, GHSA-h67p-54hq-rp68,
# GHSA-mh29-5h37-fv8m). Bumping read-yaml-file to 2.x instead — same CommonJS
# API, calls `load` — keeps a single js-yaml 4 in the tree and no 3.x line.
# The floor is ^4.3.1, not ^4.3.0: 4.3.0 is still vulnerable to GHSA-5p4m.
overrides:
  minimatch: ^10.2.6
  vite: ^7.3.2
  fast-uri: ^3.1.5
  follow-redirects: ^1.16.0
  postcss: ^8.5.23
  picomatch: ^4.0.5
  brace-expansion: ^5.0.9
  js-yaml: ^4.3.1
  read-yaml-file: ^2.1.0
  linkify-it: ^5.0.2
  esbuild: ^0.28.1

# Single source of truth for shared DEV dependency versions.
# Packages reference these via "catalog:". Bump once here.
#
# Runtime `dependencies` and `peerDependencies` of the published packages must
# NOT use "catalog:" — they carry literal ranges instead.
#
# npm is no longer the reason. `changeset publish` delegates to `pnpm publish`
# in a workspace, which rewrites the protocol, so the EUNSUPPORTEDPROTOCOL that
# shipped in 2.0.0 through 3.0.1 can no longer happen on the npm side. JSR is:
# `jsr publish` cannot read `catalog:` either, and instead of failing it drops
# the dependency and publishes anyway. The literal ranges are what `deno.json`'s
# import map is generated from, so a catalog entry there means a published JSR
# package with its dependencies silently missing.
#
# devDependencies are safe: consumers never resolve them.
catalog:
  # Shared RUNTIME versions. Packages must not reference these with "catalog:"
  # — see above. `pnpm lint` checks that each package declares the literal range
  # named here, and `pnpm lint:fix` writes it. Bump once, here.
  "@icazemier/gibbons": ^6.0.10
  cosmiconfig: ^10.0.0
  yargs: ^17.7.2
  # shared dev tooling
  # jsr is pinned exactly, not ranged: it publishes, so which build runs is not
  # something a caret should decide. Declared here rather than fetched by npx so
  # the lockfile carries its integrity hash.
  jsr: 0.14.3
  # Pinned exactly for the same reason as jsr: it decides what reaches the
  # registry, which is not a caret's call.
  "@changesets/cli": 3.0.0
  "@commitlint/cli": ^21.2.1
  "@commitlint/config-conventional": ^21.2.0
  "@eslint/js": ^10.0.0
  "@types/node": ^24.13.3
  "@types/yargs": ^17.0.33
  "@vitest/coverage-v8": ^4.1.10
  cross-env: ^10.1.0
  dotenv: ^17.4.2
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.3
  eslint-plugin-prettier: ^5.4.0
  husky: ^9.1.7
  noop-stream: ^1.0.0
  rimraf: ^6.1.3
  typedoc: ^0.28.20
  typescript: ^6.0.3
  typescript-eslint: ^8.66.0
  vitest: ^4.1.10
