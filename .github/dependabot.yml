version: 2

updates:
  # Single manifest ecosystem: the pnpm workspace is rooted here, so one entry
  # covers both packages' dependencies and the shared catalog.
  - package-ecosystem: npm
    directory: /
    # Dependency work integrates on development and reaches main through a
    # release promotion. Without this, Dependabot follows the default branch —
    # now main — and would open bumps straight against the release branch.
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # A mongodb major is not a dependency bump: it widens the published
      # `peerDependencies` range (breaking for consumers) and changes session
      # semantics the test suite pins. Tracked as its own piece of work.
      - dependency-name: mongodb
        update-types:
          - version-update:semver-major
    groups:
      # Tooling churn is noisy and never reaches consumers — land it in one PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keeps the SHA-pinned `uses:` references current; without this they are
  # pinned *and* frozen, which trades supply-chain risk for stale actions.
  - package-ecosystem: github-actions
    directory: /
    # Dependency work integrates on development and reaches main through a
    # release promotion. Without this, Dependabot follows the default branch —
    # now main — and would open bumps straight against the release branch.
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
