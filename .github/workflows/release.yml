name: Release

on:
  push:
    branches:
      - main
      - master
      - development

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.package }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - run: pnpm --filter @icazemier/${{ matrix.package }} test

  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  release:
    name: Semantic Release ${{ matrix.package }}
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    strategy:
      # Serialize so independent package releases don't race on git tags/refs.
      max-parallel: 1
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: pnpm --filter @icazemier/${{ matrix.package }} run release

  jsr:
    name: Publish ${{ matrix.package }} to JSR
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Get latest version from npm
        id: version
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            TAG="latest"
          else
            TAG="$BRANCH"
          fi
          VERSION=$(npm view @icazemier/${{ matrix.package }}@"$TAG" version 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            echo "No version found on npm for dist-tag '$TAG', skipping JSR publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update deno.json version
        if: steps.version.outputs.skip != 'true'
        env:
          JSR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const deno = JSON.parse(fs.readFileSync("deno.json", "utf8"));
            deno.version = process.env.JSR_VERSION;
            fs.writeFileSync("deno.json", JSON.stringify(deno, null, 2) + "\n");
          '
      - name: Publish to JSR
        if: steps.version.outputs.skip != 'true'
        run: npx jsr publish --allow-dirty
