name: Release

on:
  push:
    branches:
      - main
      - master
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.package }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - run: pnpm --filter @icazemier/${{ matrix.package }} test

  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:tools

  # Gates publishing on the package actually being installable by a consumer.
  # The lint guard rejects a known-bad range by name; this proves the real path
  # end to end, which is the check that was missing when 2.0.0 through 3.0.1
  # shipped uninstallable.
  pack:
    name: Verify packages install as a consumer
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:pack

  # Two jobs in one, chosen by whether changesets are pending.
  #
  # With changesets pending, the action opens (or updates) a "Version Packages"
  # pull request carrying the version bump, the changelog and the regenerated
  # deno.json. With none pending — which is the state right after that PR is
  # merged — it runs the publish command instead. So a release is always two
  # merges, and the version is reviewable before anything reaches a registry.
  #
  # That shape is not a preference: main and development both require a pull
  # request, so no bot can push a version commit straight to a release branch.
  release:
    name: Release
    needs: [test, lint, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # OIDC for trusted publishing on npm. `packages: write` is deliberately
      # absent: these packages go to npmjs.com, not GitHub Packages.
      id-token: write
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `changeset publish` shells out to `pnpm publish` in a workspace, which
      # reads the OIDC token itself — there is no npm to upgrade and no token to
      # store. It needs pnpm/action-setup at v6.0.10 or newer; older releases
      # bootstrapped a pnpm that could not see the token and failed with a 404.
      - name: Version or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run release:version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  jsr:
    name: Publish ${{ matrix.package }} to JSR
    needs: release
    runs-on: ubuntu-latest
    if: "needs.release.outputs.published == 'true'"
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs `jsr` (third-party code) while holding an OIDC token;
          # don't also leave GITHUB_TOKEN behind in .git/config for it to read.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      # No version lookup: deno.json carries the version the release just
      # published, because it is generated from package.json and lint fails when
      # the two disagree. `jsr publish` skips a version it already has, so a
      # package that got no release this run simply does nothing here.
      - name: Publish to JSR
        run: pnpm run publish:jsr

  # A release cut from main is tagged on main's own commit, and nothing brings
  # that commit back. development then still believes the old version is current
  # and computes its next beta from it, re-deriving a version that has already
  # shipped. That is not hypothetical: it is how gibbons-postgresql 3.0.1 broke
  # this pipeline under semantic-release, and changesets reads the same history
  # through package.json instead of through tags.
  #
  # GitFlow's answer is the back-merge, so it happens here rather than by
  # remembering. development requires a pull request, so this opens one.
  backmerge:
    name: Keep development in step with main
    needs: release
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Open a back-merge pull request when development is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/backmerge-main
        run: |
          set -euo pipefail
          git fetch origin main development
          if git merge-base --is-ancestor origin/main origin/development; then
            echo "development already contains main; nothing to back-merge"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH" origin/development
          if ! git merge --no-ff origin/main -m 'chore: back-merge main into development'; then
            echo "::error::main does not merge cleanly into development. Resolve it by hand; until then every release cut on main stays invisible to the beta channel."
            exit 1
          fi
          # Plain --force, not --force-with-lease: nothing fetched this branch,
          # so there is no remote-tracking ref for a lease to compare against and
          # it rejects the push the moment the branch already exists from an
          # earlier release. The branch is disposable and only this job writes it.
          git push --force origin "$BRANCH"
          open=$(gh pr list --head "$BRANCH" --base development --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "pull request #$open already open for $BRANCH"
            exit 0
          fi
          gh pr create --base development --head "$BRANCH" \
            --title 'Back-merge main into development' \
            --body 'Carries the release commits from main back to development, so the beta channel computes its next version from what has actually shipped. Opened by the Release workflow.'
