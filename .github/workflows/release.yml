name: Release

on:
  push:
    branches:
      - main
      - master
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.package }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - run: pnpm --filter @icazemier/${{ matrix.package }} test

  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:tools

  # Gates publishing on the package actually being installable by a consumer.
  # The lint guard rejects a known-bad range by name; this proves the real path
  # end to end, which is the check that was missing when 2.0.0 through 3.0.1
  # shipped uninstallable.
  pack:
    name: Verify packages install as a consumer
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:pack

  release:
    name: Semantic Release ${{ matrix.package }}
    needs: [test, lint, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # OIDC for npm trusted publishing. `packages: write` is deliberately absent:
      # these packages go to npmjs.com, not GitHub Packages.
      id-token: write
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    strategy:
      # Serialize so independent package releases don't race on git tags/refs.
      max-parallel: 1
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # semantic-release records which channel each released version went to in
      # git notes, and checkout fetches branches and tags but never notes.
      # Without them it cannot tell that an existing tag belongs to this
      # branch's channel, so it can re-derive a version that has already
      # shipped and then die creating a tag that exists.
      - name: Fetch the release channel notes
        run: git fetch origin '+refs/notes/*:refs/notes/*'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - name: Upgrade npm for trusted publishing
        # Pinned rather than @latest: this step runs immediately before the
        # publish, so an unpinned fetch would put unreviewed code next to the
        # OIDC credential.
        run: npm install -g npm@12.0.2
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: pnpm --filter @icazemier/${{ matrix.package }} run release

  jsr:
    name: Publish ${{ matrix.package }} to JSR
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs `jsr` (third-party code) while holding an OIDC token;
          # don't also leave GITHUB_TOKEN behind in .git/config for it to read.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Get latest version from npm
        id: version
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            TAG="latest"
          else
            TAG="$BRANCH"
          fi
          VERSION=$(npm view @icazemier/${{ matrix.package }}@"$TAG" version 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            echo "No version found on npm for dist-tag '$TAG', skipping JSR publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update deno.json version
        if: steps.version.outputs.skip != 'true'
        env:
          JSR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const deno = JSON.parse(fs.readFileSync("deno.json", "utf8"));
            deno.version = process.env.JSR_VERSION;
            fs.writeFileSync("deno.json", JSON.stringify(deno, null, 2) + "\n");
          '
      - name: Publish to JSR
        if: steps.version.outputs.skip != 'true'
        # Version-pinned: `npx jsr` resolves fresh from the registry on every run,
        # which would execute unreviewed code in a job holding an OIDC token.
        # `--allow-dirty` is required because the deno.json version is written above.
        run: npx --yes jsr@0.14.3 publish --allow-dirty

  # A release cut from main is tagged on main's own commit, and nothing brings
  # that commit back. development then cannot see that the version shipped, so
  # its beta channel re-derives a version whose tag already exists and the
  # release dies at `git tag`. That is not hypothetical: it is how
  # gibbons-postgresql 3.0.1 broke this pipeline.
  #
  # GitFlow's answer is the back-merge, so it happens here rather than by
  # remembering. development requires a pull request, so this opens one.
  backmerge:
    name: Keep development in step with main
    needs: release
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Open a back-merge pull request when development is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/backmerge-main
        run: |
          set -euo pipefail
          git fetch origin main development
          if git merge-base --is-ancestor origin/main origin/development; then
            echo "development already contains main; nothing to back-merge"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH" origin/development
          if ! git merge --no-ff origin/main -m 'chore: back-merge main into development'; then
            echo "::error::main does not merge cleanly into development. Resolve it by hand; until then every release tag cut on main stays invisible to the beta channel."
            exit 1
          fi
          git push --force-with-lease origin "$BRANCH"
          open=$(gh pr list --head "$BRANCH" --base development --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "pull request #$open already open for $BRANCH"
            exit 0
          fi
          gh pr create --base development --head "$BRANCH" \
            --title 'Back-merge main into development' \
            --body 'Carries the release commits and their tags from main back to development, so the beta channel can see which versions have already shipped. Opened by the Release workflow.'
