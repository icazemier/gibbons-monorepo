name: CI

on:
  # Every working branch gets CI on push, whatever it is called. Listing
  # prefixes meant a typo or an unlisted type — `fix/*` among them — silently
  # got nothing. `main` and `master` are excluded because Release already runs
  # this matrix there; `development` is not, because the Bun and Deno jobs
  # below exist only here.
  push:
    branches-ignore: [main, master]
  pull_request:
    branches: [development]

# Supersedes in-flight runs when a branch is pushed again. `github.ref` keeps
# push and pull_request in separate groups on purpose: collapsing them cancels
# the push run, and its jobs then report as cancelled against the pull request,
# which reads as a red check even though the pull-request run passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only builds and tests; nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  lint:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test ${{ matrix.package }} on Node ${{ matrix.node-version }}
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - run: pnpm --filter @icazemier/${{ matrix.package }} test

  bun:
    name: Run ${{ matrix.package }} on Bun
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      # pnpm is the single installer (catalog: protocol); Bun is the runtime under test.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test

  deno:
    name: Import check ${{ matrix.package }} on Deno
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - name: Smoke test
        working-directory: packages/${{ matrix.package }}
        run: deno run --allow-env --allow-net --allow-read --allow-sys compat/deno.ts
