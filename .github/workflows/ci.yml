name: CI

on:
  # Every working branch gets CI on push, whatever it is called. Listing
  # prefixes meant a typo or an unlisted type — `fix/*` among them — silently
  # got nothing. `main` and `master` are excluded because Release already runs
  # this matrix there; `development` is not, because the Bun and Deno jobs
  # below exist only here.
  push:
    branches-ignore: [main, master]
  # Every long-lived base, not just the integration branch. `main` is the
  # default branch, so GitHub pre-selects it for new pull requests — listing
  # only `development` here meant a pull request opened against the default
  # would run no CI at all, the same silent gap the push filter above had.
  pull_request:
    branches: [main, master, development]

# Supersedes in-flight runs when a branch is pushed again. `github.ref` keeps
# push and pull_request in separate groups on purpose: collapsing them cancels
# the push run, and its jobs then report as cancelled against the pull request,
# which reads as a red check even though the pull-request run passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only builds and tests; nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  lint:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:tools

  # Installs each package the way a consumer does — packed tarball, npm, a
  # throwaway project outside the workspace. Every other job here runs inside
  # the pnpm workspace, which is exactly how `catalog:` reached the registry in
  # published dependency ranges while all of them stayed green.
  pack:
    name: Verify packages install as a consumer
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:pack

  test:
    name: Test ${{ matrix.package }} on Node ${{ matrix.node-version }}
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - run: pnpm --filter @icazemier/${{ matrix.package }} test

  bun:
    name: Run ${{ matrix.package }} on Bun
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      # pnpm is the single installer (catalog: protocol); Bun is the runtime under test.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test

  deno:
    name: Import check ${{ matrix.package }} on Deno
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [gibbons-mongodb, gibbons-postgresql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icazemier/${{ matrix.package }} build
      - name: Smoke test
        working-directory: packages/${{ matrix.package }}
        run: deno run --allow-env --allow-net --allow-read --allow-sys compat/deno.ts
      # `pnpm lint` is the broad check: it proves deno.json agrees with
      # package.json in both directions. This asks the tool that actually
      # publishes whether it agrees, which covers the narrower case of jsr
      # changing how it reads package.json. jsr cannot resolve pnpm's
      # `catalog:` protocol and, rather than failing, drops the dependency and
      # publishes anyway — so a dry run exiting 0 proves nothing by itself and
      # the warning it prints is the only signal.
      - name: Every dependency resolves for JSR
        working-directory: packages/${{ matrix.package }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/jsr-dry-run.log"
          npx --yes jsr@0.14.3 publish --dry-run --allow-dirty 2>&1 | tee "$log"
          if grep -q 'failed to resolve' "$log"; then
            echo "::error::jsr could not resolve a package.json dependency, so it would be dropped from the published package. Run 'pnpm lint:fix' and commit deno.json."
            exit 1
          fi
